<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN Muebles - Administrador y Diseñador 3D</title>
    <!-- Three.js y dependencias necesarias para el Diseñador 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg-light: #f4f6f7;
            --border: #bdc3c7;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: #333;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }
        .sidebar {
            width: 350px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        .viewport-container {
            flex: 1;
            position: relative;
        }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }
        h2, h3 {
            color: var(--primary);
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 0.5rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .section-box {
            background: #fafafa;
            border: 1px solid #e1e1e1;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>HN Muebles</h1>
        <span>Diseñador 3D - Etapa 2 (Montantes y Selección Directa)</span>
    </header>

    <div class="main-container">
        <!-- Panel Unificado -->
        <div class="sidebar">
            <h2>Panel de Control</h2>
            
            <div class="section-box">
                <h3>Espacios y Elementos</h3>
                <div class="form-group">
                    <label for="selectEspacio">Espacio Seleccionado</label>
                    <select id="selectEspacio">
                        <option value="espacio-1">Espacio Principal (Vano 1)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantMontantes">Cantidad de Montantes</label>
                    <input type="number" id="cantMontantes" value="1" min="1" max="10">
                </div>
                <button onclick="agregarMontantes()">Agregar Montantes</button>
            </div>

            <div class="section-box" id="panelEdicionPieza">
                <h3>Edición de Pieza Seleccionada</h3>
                <p id="infoPiezaSeleccionada" style="font-size: 0.85rem; color: #666;">Ninguna pieza seleccionada en 3D.</p>
                
                <div id="controlesPropiedades" style="display: none;">
                    <div class="form-group">
                        <label id="labelPosicionIndependiente">Posición (mm)</label>
                        <input type="number" id="inputPosIndependiente" oninput="actualizarPosicionPieza()">
                    </div>
                    <div class="form-group">
                        <label>Ancho (mm)</label>
                        <input type="number" id="propAncho" oninput="actualizarDimensionesPieza()">
                    </div>
                    <div class="form-group">
                        <label>Alto (mm)</label>
                        <input type="number" id="propAlto" oninput="actualizarDimensionesPieza()">
                    </div>
                    <div class="form-group">
                        <label>Profundidad (mm)</label>
                        <input type="number" id="propProfundidad" oninput="actualizarDimensionesPieza()">
                    </div>
                    <div class="form-group">
                        <label>Espesor (mm)</label>
                        <input type="number" id="propEspesor" oninput="actualizarDimensionesPieza()">
                    </div>
                </div>
            </div>
        </div>

        <!-- Vista 3D -->
        <div class="viewport-container">
            <div id="canvas3d"></div>
        </div>
    </div>

    <script>
        // Variables principales del Diseñador 3D
        let scene, camera, renderer, controls;
        let piezasMueble = [];
        let piezaSeleccionada = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // Datos del espacio base (ejemplo paramétrico)
        const espacioActual = {
            id: 'espacio-1',
            xMin: -400,
            xMax: 400,
            yMin: -500,
            yMax: 500,
            profundidad: 500
        };

        function init3D() {
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf4f6f7);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 5000);
            camera.position.set(0, 0, 1200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 500, 1000);
            scene.add(directionalLight);

            // Estructura base del mueble de prueba
            crearEstructuraBase();

            // Eventos
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onMouseDown3D);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas3d');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function crearEstructuraBase() {
            // Ejemplo de repisa fija para comprobación de selección directa
            const geometry = new THREE.BoxInfoGeometry ? new THREE.BoxGeometry(800, 20, 500) : new THREE.BoxGeometry(800, 20, 500);
            const material = new THREE.MeshLambertMaterial({ color: 0xd7ccc8 });
            const repisaBase = new THREE.Mesh(geometry, material);
            repisaBase.position.set(0, 0, 0);
            repisaBase.userData = {
                id: 'repisa-base-1',
                tipo: 'repisa',
                spaceId: 'espacio-1',
                ancho: 800,
                alto: 20,
                profundidad: 500,
                espesor: 20
            };
            scene.add(repisaBase);
            piezasMueble.push(repisaBase);
        }

        // 1. MONTANTES
        function agregarMontantes() {
            const cantidad = parseInt(document.getElementById('cantMontantes').value) || 1;
            const anchoEspacio = espacioActual.xMax - espacioActual.xMin;
            const paso = anchoEspacio / (cantidad + 1);
            const espesorMontante = 18;

            for (let i = 1; i <= cantidad; i++) {
                const posXRelativa = paso * i; // Desde la izquierda del espacio
                const posXGlobal = espacioActual.xMin + posXRelativa;

                const geometry = new THREE.BoxGeometry(espesorMontante, espacioActual.yMax - espacioActual.yMin, espacioActual.profundidad);
                const material = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
                const montante = new THREE.Mesh(geometry, material);

                montante.position.set(posXGlobal, 0, 0);
                
                const idMontante = 'montante-' + Date.now() + '-' + i;
                montante.userData = {
                    id: idMontante,
                    tipo: 'montante',
                    spaceId: espacioActual.id,
                    desdeIzquierda: posXRelativa + (anchoEspacio / 2), // Normalizado visualmente para el panel
                    ancho: espesorMontante,
                    alto: espacioActual.yMax - espacioActual.yMin,
                    profundidad: espacioActual.profundidad,
                    espesor: espesorMontante
                };

                scene.add(montante);
                piezasMueble.push(montante);
            }
        }

        // 2. SELECCIÓN DIRECTA EN 3D
        function onMouseDown3D(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(piezasMueble);

            if (intersects.length > 0) {
                const piezaSeleccionadaMesh = intersects[0].object;
                seleccionarPieza(piezaSeleccionadaMesh);
            }
        }

        function seleccionarPieza(mesh) {
            // Restaurar color anterior si existe
            piezasMueble.forEach(p => {
                if (p.userData.tipo === 'montante') p.material.color.set(0x8d6e63);
                else p.material.color.set(0xd7ccc8);
            });

            piezaSeleccionada = mesh;
            piezaSeleccionada.material.color.set(0xe67e22); // Resaltar visualmente

            // Cargar propiedades en el panel existente
            document.getElementById('infoPiezaSeleccionada').innerText = `Pieza: ${piezaSeleccionada.userData.tipo.toUpperCase()} (ID: ${piezaSeleccionada.userData.id})`;
            document.getElementById('controlesPropiedades').style.display = 'block';

            document.getElementById('propAncho').value = piezaSeleccionada.userData.ancho;
            document.getElementById('propAlto').value = piezaSeleccionada.userData.alto;
            document.getElementById('propProfundidad').value = piezaSeleccionada.userData.profundidad;
            document.getElementById('propEspesor').value = piezaSeleccionada.userData.espesor;

            const labelPos = document.getElementById('labelPosicionIndependiente');
            const inputPos = document.getElementById('inputPosIndependiente');

            if (piezaSeleccionada.userData.tipo === 'montante') {
                labelPos.innerText = "Desde la izquierda (mm)";
                inputPos.value = Math.round(piezaSeleccionada.userData.desdeIzquierda);
            } else if (piezaSeleccionada.userData.tipo === 'repisa') {
                labelPos.innerText = "Desde abajo (mm)";
                inputPos.value = Math.round(piezaSeleccionada.position.y + (espacioActual.yMax - espacioActual.yMin) / 2);
            } else {
                labelPos.innerText = "Posición X (mm)";
                inputPos.value = Math.round(piezaSeleccionada.position.x);
            }
        }

        // 3. EDICIÓN INDIVIDUAL
        function actualizarPosicionPieza() {
            if (!piezaSeleccionada) return;
            const valor = parseFloat(document.getElementById('inputPosIndependiente').value) || 0;

            if (piezaSeleccionada.userData.tipo === 'montante') {
                piezaSeleccionada.userData.desdeIzquierda = valor;
                // SOLO se mueve este montante individualmente
                const nuevaXGlobal = espacioActual.xMin + valor;
                piezaSeleccionada.position.x = nuevaXGlobal;
            } else if (piezaSeleccionada.userData.tipo === 'repisa') {
                const nuevaYGlobal = valor - (espacioActual.yMax - espacioActual.yMin) / 2;
                piezaSeleccionada.position.y = nuevaYGlobal;
            }
        }

        function actualizarDimensionesPieza() {
            if (!piezaSeleccionada) return;
            piezaSeleccionada.userData.ancho = parseFloat(document.getElementById('propAncho').value) || piezaSeleccionada.userData.ancho;
            piezaSeleccionada.userData.alto = parseFloat(document.getElementById('propAlto').value) || piezaSeleccionada.userData.alto;
            piezaSeleccionada.userData.profundidad = parseFloat(document.getElementById('propProfundidad').value) || piezaSeleccionada.userData.profundidad;
            piezaSeleccionada.userData.espesor = parseFloat(document.getElementById('propEspesor').value) || piezaSeleccionada.userData.espesor;
            
            // Actualizar geometría de forma independiente sin recalcular otras piezas
            piezaSeleccionada.geometry.dispose();
            piezaSeleccionada.geometry = new THREE.BoxGeometry(
                piezaSeleccionada.userData.ancho,
                piezaSeleccionada.userData.alto,
                piezaSeleccionada.userData.profundidad
            );
        }

        window.onload = init3D;
    </script>
</body>
</html>
