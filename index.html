<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HN Muebles | HN Designer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="hn-designer">
  <div class="hn-topbar">
    <div class="hn-topbar-left">
      <div class="hn-logo-area"><span class="hn-brand">HN MUEBLES</span><span class="hn-subbrand">HN DESIGNER</span></div>
      <div class="hn-menu-bar">
        <button class="hn-menu-btn" onclick="crearModuloNuevoParametrico()">Nuevo Módulo</button>
        <button class="hn-menu-btn" onclick="agregarMontanteParametricoModal()">+ Montante</button>
        <button class="hn-menu-btn" onclick="agregarRepisaParametricaPrompt()">+ Repisa</button>
        <button class="hn-menu-btn hn-drawer-btn" onclick="agregarCajonParametricoPrompt()">+ Cajón</button>
      </div>
    </div>
    <div class="hn-topbar-right">
      <span class="hn-version">Motor Paramétrico v9.1 (Milímetros)</span>
      <button class="hn-close-designer-btn" onclick="cerrarHNDesigner()">Cerrar Diseñador</button>
    </div>
  </div>
  <div class="hn-main-layout">
    <div class="hn-left-panel">
      <div class="hn-sidebar-section">
        <div class="hn-sidebar-title">Proyecto</div>
        <div class="hn-sidebar-group"><div class="hn-tool-item" onclick="crearModuloNuevoParametrico()">Nuevo módulo <span class="hn-note">Sistema</span></div></div>
      </div>
      <div class="hn-sidebar-section">
        <div class="hn-sidebar-title">Estructura & Espacios</div>
        <div class="hn-sidebar-group">
          <div class="hn-tool-item" onclick="agregarMontanteParametricoModal()">Agregar montante <span class="hn-note">Vertical</span></div>
          <div class="hn-tool-item" onclick="agregarRepisaParametricaPrompt()">Agregar repisa <span class="hn-note">Horizontal</span></div>
          <div class="hn-tool-item" onclick="agregarCajonParametricoPrompt()">Agregar cajón <span class="hn-note drawer-note">Conjunto</span></div>
        </div>
      </div>
      <div class="hn-sidebar-section hn-space-list-section">
        <div class="hn-sidebar-title">Espacios del Módulo</div>
        <div id="hn-lista-espacios-sidebar" class="hn-space-list"></div>
      </div>
    </div>
    <div class="hn-center-viewport" id="hn-viewport-3d"></div>
    <div class="hn-right-panel">
      <div class="hn-properties-header"><div class="hn-properties-title"><span id="hn-prop-title-text">DIMENSIONES MAESTRAS</span><span class="hn-selected-indicator" id="hn-selected-badge">Módulo</span></div></div>
      <div class="hn-properties-body" id="hn-properties-content-container"></div>
    </div>
  </div>
</div>
<script src="designer.js"></script>
</body>
</html>
